<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동구청 민원문자 관리 시스템 - 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161d;
    --ink-soft: #555c6c;
    --paper: #eef1f6;
    --surface: #ffffff;
    --line: #e2e6ee;
    --accent: #2452c9;
    --accent-deep: #142e73;
    --bad: #ae3226;
    --bad-soft: #fae7e4;
    --radius: 12px;
    --shadow-md: 0 14px 32px -14px rgba(20,22,29,.18), 0 3px 8px -3px rgba(20,22,29,.08);
    --font-ui: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui);
    background:
      radial-gradient(1100px 460px at 12% -10%, rgba(36,82,201,.08), transparent 60%),
      var(--paper);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    width: 340px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 32px 28px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 11px; margin: 0 auto 14px;
    background: linear-gradient(150deg, var(--accent), var(--accent-deep));
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 16px; text-align: center; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin: 0 0 22px; line-height: 1.6; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 0 0 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 13.5px; outline: none; margin-bottom: 14px; background: #fff;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .error {
    background: var(--bad-soft); color: var(--bad); font-size: 12.5px;
    border-radius: 8px; padding: 9px 11px; margin-bottom: 14px; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="login-box">
    <div class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    {% if first_run %}
    <h1>관리자 계정 만들기</h1>
    <p class="sub">아직 계정이 없습니다. 처음 만드는 계정이 관리자 계정이 되며,<br>나중에 다른 팀원 계정을 여기서 추가할 수 있습니다.</p>
    {% else %}
    <h1>동구청 민원문자 관리 시스템</h1>
    <p class="sub">로그인해주세요.</p>
    {% endif %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">비밀번호{% if first_run %} (4자 이상){% endif %}</label>
      <input type="password" id="password" name="password" autocomplete="{{ 'new-password' if first_run else 'current-password' }}" required>
      <button type="submit">{{ '관리자 계정 만들고 시작하기' if first_run else '로그인' }}</button>
    </form>
  </div>
</body>
</html>
