<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto_sms — 휴대폰 문자 자동화</title>
<style>
  :root {
    --ink: #171a21;
    --ink-soft: #5b6270;
    --ink-faint: #9298a3;
    --paper: #eef1f5;
    --surface: #ffffff;
    --line: #e3e6ec;
    --accent: #2148c0;
    --accent-soft: #e8edfb;
    --good: #157f5a;
    --good-soft: #e5f4ee;
    --bad: #c0392b;
    --mark: #b5860c;
    --mark-soft: #faf1d6;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    background: var(--paper);
    margin: 0;
    padding: 28px clamp(16px, 4vw, 40px);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1 { font-size: 19px; margin: 0 0 4px; flex: 0 0 auto; }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; flex: 0 0 auto; }

  /* 왼쪽 고정폭 사이드레일(설정류: 자동발송·상용문구) + 오른쪽 메인(민원 목록) —
     둘 다 화면 높이에 맞춰 각자 내부에서 스크롤한다(한쪽이 길어져도 다른
     쪽/헤더 위치는 그대로 유지됨). */
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; flex: 1 1 auto; overflow-y: auto; } }
  /* 업무외 자동발송 카드는 항상 고정, 상용문구 카드만 자기 영역 안에서 스크롤 */
  .rail { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .rail > .card { flex: 0 0 auto; }
  .rail > .card.card-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  @media (max-width: 900px) { .rail > .card.card-scroll { flex: 0 0 auto; overflow: visible; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; color: var(--ink); }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  select, input[type=text], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px; background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; border-radius: 8px; padding: 9px 16px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: #9fb0e0; cursor: default; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .btn-danger { background: #fbe4e1; color: var(--bad); }
  .tpl-item {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .tpl-item:last-child { border-bottom: none; }
  .tpl-title { font-weight: 600; }
  .tpl-body { color: var(--ink-soft); font-size: 12px; margin-top: 2px; white-space: pre-line; }
  .tpl-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .tpl-actions button { padding: 4px 9px; font-size: 12px; }
  .tpl-more { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; padding: 10px 0 0; width: 100%; text-align: left; }

  /* 업무외 자동발송 — 토글 스위치 */
  .status-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .status-toggle .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
  .status-toggle .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .status-toggle .switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
  .status-toggle .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 999px; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; pointer-events: none; }
  .status-toggle .switch input:checked + .track { background: var(--good); }
  .status-toggle .switch input:checked + .track + .knob { transform: translateX(16px); }
  .toggle-label { font-size: 12.5px; color: var(--ink-soft); }
  .schedule-note { font-size: 11.5px; color: var(--ink-faint); margin: 8px 0 14px; line-height: 1.6; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 9px; font-weight: 600; }
  .pill-in { background: var(--accent-soft); color: var(--accent); }
  .pill-out { background: var(--good-soft); color: var(--good); }
  .pill-muted { background: var(--paper); color: var(--ink-faint); }
  .empty { color: var(--ink-faint); font-size: 13px; padding: 10px 20px; }
  .cell-input {
    width: 100%; padding: 5px 7px; margin: 0; border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; font-size: 11.5px; background: #fff; color: var(--ink);
  }
  .cell-input.saved { border-color: var(--good); }
  .icon-btn {
    background: none; border: none; padding: 2px 6px; font-size: 14px; cursor: pointer; border-radius: 6px;
  }
  .icon-btn:hover { background: var(--accent-soft); }

  /* 민원 문자 목록 — 민원(수신) 한 건 + 그 아래 이어지는 답신(발신)들 */
  .msg-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .msg-card-head { flex: 0 0 auto; padding: 18px 20px 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .msg-card-head h2 { font-size: 14px; margin: 0; }
  #threadList { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  @media (max-width: 900px) { #threadList { overflow: visible; } }
  .head-stats { display: flex; gap: 8px; font-size: 11.5px; color: var(--ink-soft); }
  .head-stats span { background: var(--paper); border-radius: 999px; padding: 3px 10px; font-variant-numeric: tabular-nums; }
  .merge-bar { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .merge-bar button { padding: 5px 10px; font-size: 12px; }
  .merge-bar .btn-primary:disabled { background: #9fb0e0; cursor: default; }
  .thread { border-top: 1px solid var(--line); }
  .msg-row, .col-head {
    display: grid; grid-template-columns: 22px 128px 100px 70px 1fr 96px 116px 130px 34px;
    gap: 10px; align-items: start; padding: 12px 20px;
  }
  .col-head {
    flex: 0 0 auto;
    padding: 10px 20px; align-items: center; border-top: 1px solid var(--line);
    font-size: 11px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .02em;
  }
  .col-head > div { text-align: center; }
  .select-col { display: flex; justify-content: center; padding-top: 2px; }
  .select-col input { margin: 0; cursor: pointer; }
  .msg-row .meta { font-size: 12px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .msg-row .phone { font-size: 12.5px; font-weight: 600; }
  .msg-row .name { font-size: 12px; color: var(--ink-soft); }
  .msg-body { font-size: 13px; line-height: 1.55; white-space: pre-line; }
  .msg-body .pill, .reply-body .pill { margin-right: 6px; }
  .status-col, .input-col, .receipt-col {
    display: flex; justify-content: center; align-items: center; text-align: center;
    font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-col select, .input-col select, .receipt-col input {
    width: 100%; margin-bottom: 0; font-family: inherit; font-size: 12px; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); text-align: center;
  }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--paper); color: var(--ink-soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tag-empty { background: none; font-weight: 400; color: var(--ink-faint); }
  .receipt-col .tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
  .edit-col { display: flex; justify-content: center; padding-top: 2px; }
  .replies { padding: 0 20px 10px calc(20px + 22px + 128px + 10px); }
  .reply { display: flex; gap: 10px; padding: 7px 0 7px 26px; border-left: 2px solid var(--line); margin-left: 6px; position: relative; }
  .reply::before { content: ''; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .reply-body { font-size: 12.5px; color: var(--ink-soft); flex: 1; line-height: 1.5; }
  .reply-time { font-size: 11px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .toggle-send { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; margin: 0 0 10px calc(20px + 22px + 128px + 10px + 26px); padding: 4px 0; }
  .send-box { margin: 0 20px 14px calc(20px + 22px + 128px + 10px + 26px); padding: 10px 12px; background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; }
  .send-box .row { display: flex; gap: 8px; }
  .send-box select { flex: 0 0 auto; width: auto; margin-bottom: 0; font-family: inherit; font-size: 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .send-box textarea { flex: 1; margin-bottom: 0; font-family: inherit; font-size: 12.5px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 34px; }
  .send-box button { flex: 0 0 64px; width: 64px; padding: 0; }
  .status-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .st-접수 { background: var(--accent-soft); color: var(--accent); }
  .st-부서전달 { background: var(--mark-soft); color: var(--mark); }
  .st-담당자확인 { background: #f1eafa; color: #6d3fa0; }
  .st-처리완료 { background: var(--good-soft); color: var(--good); }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 4px; padding: 14px 20px; flex-wrap: wrap; }
  .page-btn {
    min-width: 30px; padding: 5px 8px; font-size: 12px; font-weight: 600;
    background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); border-radius: 6px;
  }
  .page-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { color: var(--ink-faint); cursor: default; }
</style>
</head>
<body>

<h1>📱 auto_sms</h1>
<p class="sub">휴대폰과 연결 앱으로 수신한 문자를 자동 저장하고, 민원별로 답신을 이어서 발송합니다.</p>

<div class="layout">
  <div class="rail">
    <div class="card">
      <h2>🌙 업무외 자동발송</h2>
      <div class="status-toggle">
        <span class="toggle-label">평일 09:00~18:00 외 시간 자동 응답</span>
        <label class="switch">
          <input type="checkbox" id="autoReplyEnabled" onchange="saveAutoReplySettings()">
          <span class="track"></span>
          <span class="knob"></span>
        </label>
      </div>
      <div id="autoReplyStatus" class="schedule-note"></div>
      <select id="autoReplyTemplateSelect" onchange="saveAutoReplySettings()">
        <option value="">— 자동발송할 상용문구 선택 —</option>
      </select>
    </div>

    <div class="card card-scroll">
      <h2>💬 상용문구 관리</h2>
      <div id="templateList"><div class="empty">불러오는 중…</div></div>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px;">
        <input type="hidden" id="tplEditId">
        <label>문구 제목</label>
        <input type="text" id="tplTitleInput" placeholder="예: 접수 확인 안내">
        <label>문구 내용</label>
        <textarea id="tplBodyInput" placeholder="실제 발송될 문구"></textarea>
        <div class="row">
          <button class="btn-primary" onclick="saveTemplate()">저장</button>
          <button class="btn-ghost" onclick="resetTemplateForm()">새 문구로 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <div class="msg-card">
    <div class="msg-card-head">
      <h2>📨 민원 문자 목록</h2>
      <div class="head-stats" id="headStats">
        <span id="statToday">오늘 접수 0건</span>
        <span id="statPending">미처리 0건</span>
      </div>
      <div class="merge-bar" id="mergeBar">
        <span id="mergeCount"></span>
        <button class="btn-primary" id="mergeBtn" onclick="mergeSelectedThreads()" disabled>선택한 민원 병합</button>
        <button class="btn-danger" id="deleteBtn" onclick="deleteSelectedThreads()">선택한 민원 삭제</button>
        <button class="btn-ghost" onclick="clearThreadSelection()">선택 해제</button>
      </div>
    </div>
    <div class="col-head">
      <div class="select-col"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllThreads(this.checked)" title="현재 페이지 전체 선택"></div>
      <div>시각</div>
      <div>번호</div>
      <div>이름</div>
      <div>내용</div>
      <div>처리상태</div>
      <div>입력</div>
      <div>접수번호</div>
      <div></div>
    </div>
    <div id="threadList"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
